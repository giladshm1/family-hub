<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6366F1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="הבית שלנו" />
  <title>הבית שלנו · לוח משפחתי</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>" />

  <!-- Google Fonts: Heebo -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Heebo', 'system-ui', 'sans-serif'] },
          boxShadow: {
            soft: '0 10px 30px -12px rgba(30, 41, 59, 0.18)',
            lift: '0 20px 40px -16px rgba(30, 41, 59, 0.28)',
          },
        },
      },
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Reusable component classes -->
  <style type="text/tailwindcss">
    @layer components {
      .card        { @apply bg-white/90 backdrop-blur rounded-[28px] shadow-soft border border-white p-5 sm:p-6; }
      .field       { @apply w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-slate-800 shadow-sm outline-none transition focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100; }
      .label       { @apply block text-sm font-semibold text-slate-600 mb-1.5; }
      .btn-primary { @apply inline-flex items-center justify-center gap-2 rounded-2xl bg-gradient-to-l from-indigo-600 to-violet-600 px-5 py-3.5 font-bold text-white shadow-lg shadow-indigo-500/30 transition hover:brightness-110 active:scale-[0.98] disabled:opacity-60; }
      .btn-ghost   { @apply inline-flex items-center justify-center gap-2 rounded-full bg-white px-3.5 py-2.5 text-sm font-semibold text-slate-600 shadow-soft border border-slate-100 transition hover:text-indigo-600 hover:border-indigo-200 active:scale-95; }
      .chip        { @apply inline-flex items-center gap-1 rounded-full border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-slate-600 transition hover:border-indigo-300 hover:text-indigo-600; }
      .chip-active { @apply border-indigo-500 bg-indigo-50 text-indigo-700; }
      .avatar      { @apply inline-flex items-center justify-center rounded-full shrink-0 select-none font-bold; }
      .score-btn   { @apply w-9 h-9 rounded-xl flex items-center justify-center transition active:scale-90 disabled:opacity-30 disabled:pointer-events-none; }
      .tab-btn     { @apply flex items-center gap-2 whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-500 transition hover:text-slate-800; }
      .tab-active  { @apply bg-slate-900 text-white shadow-md hover:text-white; }
    }
  </style>

  <style>
    body {
      background-color: #f6f7fb;
      background-image:
        radial-gradient(at 100% 0%, rgba(99, 102, 241, 0.13) 0, transparent 45%),
        radial-gradient(at 0% 10%, rgba(236, 72, 153, 0.10) 0, transparent 40%),
        radial-gradient(at 50% 100%, rgba(20, 184, 166, 0.09) 0, transparent 50%);
      background-attachment: fixed;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes fadeUp  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes pop     { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }
    @keyframes modalIn { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    .anim-fade-up   { animation: fadeUp .45s cubic-bezier(.2,.8,.2,1) both; }
    .anim-pop       { animation: pop .45s ease; }
    .toast          { animation: toastIn .3s cubic-bezier(.2,.8,.2,1) both; transition: opacity .3s, transform .3s; }
    .toast-leave    { opacity: 0; transform: translateY(10px); }
    .modal-panel    { animation: modalIn .3s cubic-bezier(.2,.8,.2,1) both; }
    .modal-backdrop { animation: fadeIn .2s ease both; }
    .bar-fill       { transition: width .6s cubic-bezier(.2,.8,.2,1); }
    .login-card:hover, .login-card:focus-visible { border-color: var(--c); box-shadow: 0 20px 40px -18px var(--c); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    .thin-scroll::-webkit-scrollbar { width: 6px; }
    .thin-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 99px; }
    input[type="date"], input[type="time"] { min-height: 3rem; }
  </style>
</head>

<body class="font-sans text-slate-800 antialiased min-h-screen">
  <div id="app"></div>
  <div id="toast-root" class="fixed bottom-5 inset-x-0 z-[60] flex flex-col items-center gap-2 px-4 pointer-events-none"></div>
  <div id="modal-root"></div>

  <!-- App code (ES modules): config.js · data.js · store.js · ui.js · widgets.js · app.js -->
  <script type="module" src="./app.js"></script>
</body>
</html>
